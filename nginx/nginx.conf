user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # 10 requests/sec per client IP on auth endpoints -- a deliberate, visible
    # piece of Nginx config rather than just a reverse-proxy placeholder.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    upstream vpnfleet_app {
        server app:8080;
    }

    server {
        listen 80;

        location /api/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://vpnfleet_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://vpnfleet_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/(swagger-ui.*|v3/api-docs.*)$ {
            proxy_pass http://vpnfleet_app;
            proxy_set_header Host $host;
        }

        location /actuator/health {
            proxy_pass http://vpnfleet_app;
        }
    }
}
